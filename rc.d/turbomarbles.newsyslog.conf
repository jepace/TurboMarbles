# newsyslog(8) rotation for the TurboMarbles service log.
# Installed by deploy.sh as /etc/newsyslog.conf.d/turbomarbles.conf in the jail.
# Rotates at 1 MB, keeps 7 bzip2'd copies, and sends SIGHUP to the daemon(8)
# supervisor (started with -H), which reopens the log file.
#
# logfilename               owner:group      mode count size when flags pid_file                                signal
/var/log/turbomarbles.log   marbles:marbles  640  7     1024 *    JC    /var/run/turbomarbles/turbomarbles.pid  SIGHUP
