<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="TurboMarbles">
  <defs>
    <radialGradient id="m1" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="0.28" stop-color="#ffb366"/><stop offset="0.7" stop-color="#ff7800"/><stop offset="1" stop-color="#8a3a00"/></radialGradient>
    <radialGradient id="m2" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="0.28" stop-color="#7fc0ff"/><stop offset="0.7" stop-color="#2288f0"/><stop offset="1" stop-color="#0b3f80"/></radialGradient>
    <radialGradient id="m3" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="0.28" stop-color="#ff8fcb"/><stop offset="0.7" stop-color="#e8208c"/><stop offset="1" stop-color="#6e0a41"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="0.55" stop-color="#f5c842"/><stop offset="1" stop-color="#c8920a"/></linearGradient>
  </defs>
  <!-- speed lines -->
  <g stroke="#f5c842" stroke-linecap="round" opacity="0.85">
    <line x1="6" y1="48" x2="40" y2="48" stroke-width="5"/>
    <line x1="14" y1="62" x2="44" y2="62" stroke-width="5" opacity="0.7"/>
    <line x1="2" y1="76" x2="38" y2="76" stroke-width="5" opacity="0.5"/>
  </g>
  <!-- three marbles rolling -->
  <circle cx="72" cy="62" r="24" fill="url(#m1)"/>
  <circle cx="112" cy="50" r="18" fill="url(#m2)"/>
  <circle cx="104" cy="86" r="14" fill="url(#m3)"/>
  <circle cx="64" cy="53" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="107" cy="44" r="4.5" fill="#fff" opacity="0.8"/>
  <circle cx="100" cy="81" r="3.5" fill="#fff" opacity="0.8"/>
  <!-- wordmark -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-style="italic">
    <text x="142" y="68" font-size="48" letter-spacing="-1"><tspan fill="url(#gold)">TURBO</tspan><tspan fill="#ffffff" dx="6">MARBLES</tspan></text>
    <text x="146" y="98" font-size="17" fill="#9fb3d1" font-style="normal" font-weight="700" letter-spacing="5">THE MARBLE RACING GAME</text>
  </g>
</svg>
