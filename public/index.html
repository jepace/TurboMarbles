<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurboMarbles</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== SCREENS ===== -->

<div id="screen-landing" class="screen active">
  <div class="card">
    <h1>TurboMarbles</h1>
    <p class="tagline">Race your marbles. Wreck your friends.</p>
    <div id="account-line" class="account-line"></div>
    <input id="landing-name" type="text" maxlength="20" placeholder="Your name" autocomplete="off" autofocus>
    <label id="remember-row" class="opt-row" title="Saves your name and a private key in this browser, and keeps your games and statistics">
      <input type="checkbox" id="landing-remember" checked> Keep my stats (remember me on this device)
    </label>
    <div class="btn-row">
      <button id="btn-create">Create Game</button>
      <button id="btn-join">Join Game</button>
    </div>
    <div class="btn-row small-links">
      <button id="btn-profile" class="secondary" style="display:none">Profile &amp; settings</button>
      <button id="btn-use-code" class="link-btn">Signed in on another device? Use a link code</button>
    </div>
  </div>
</div>

<div id="screen-create" class="screen">
  <div class="card">
    <h2>Create Game</h2>
    <label>Players (2–6)
      <input id="create-count" type="number" min="2" max="6" value="4">
    </label>
    <div id="create-colors" class="color-picker-row"></div>
    <label id="create-cube-row" class="opt-row" title="Money play: double at the start of your turn; an aggro (loser has no marbles home) counts double">
      <input type="checkbox" id="create-cube"> Doubling cube <span id="create-cube-note" class="muted"></span>
    </label>
    <label id="create-match-row" class="opt-row" title="Play a match to this many points (Crawford rule applies). 0 = a money session that just keeps score.">
      Match to <input type="number" id="create-match" min="0" max="25" value="0" style="width:4.5em"> points <span class="muted">(0 = money session)</span>
    </label>
    <label id="create-jacoby-row" class="opt-row" title="Money play: an aggro only counts double once the cube has been turned">
      <input type="checkbox" id="create-jacoby"> Jacoby rule
    </label>
    <div class="btn-row">
      <button id="btn-create-confirm" class="btn-go">Create</button>
      <button class="secondary" id="btn-create-back">Back</button>
    </div>
  </div>
</div>

<div id="screen-profile" class="screen">
  <div class="card profile-card">
    <div class="profile-head">
      <h2 id="profile-name"></h2>
      <button id="btn-profile-back" class="secondary">Back</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="people">vs People</button>
      <button class="tab" data-tab="robots">vs Robots</button>
    </div>
    <div id="profile-stats"></div>
    <div id="profile-trend"></div>
    <h3>Head to head</h3>
    <div id="profile-h2h"></div>
    <h3>Games</h3>
    <div id="profile-games"></div>
    <button id="btn-more-games" class="secondary" style="display:none">More…</button>
    <h3>Account</h3>
    <div id="profile-account"></div>
  </div>
</div>

<div id="screen-join" class="screen">
  <div class="card">
    <h2>Join Game</h2>
    <input id="join-code" type="text" maxlength="6" placeholder="Room code" autocomplete="off" style="text-transform:uppercase">
    <div class="btn-row">
      <button id="btn-join-confirm">Join</button>
      <button class="secondary" id="btn-join-back">Back</button>
    </div>
  </div>
</div>

<div id="screen-lobby" class="screen">
  <div class="card wide">
    <h2>Waiting Room</h2>
    <p>Room code: <strong id="lobby-code"></strong><button id="btn-copy-code" class="btn-icon" title="Copy code">⧉</button> &nbsp;·&nbsp; <span id="lobby-size"></span></p>
    <ul id="lobby-slots"></ul>
    <div class="btn-row" id="host-controls" style="display:none">
      <button id="btn-add-robot" class="secondary">+ Robot</button>
      <button id="btn-start" class="btn-go">Start Game</button>
    </div>
    <p id="lobby-wait-msg" style="display:none">Waiting for host to start…</p>
  </div>
</div>

<div id="screen-game" class="screen">
  <div id="game-layout">
    <div id="board-area">
      <canvas id="board-canvas"></canvas>
      <div id="board-tip" style="display:none"></div>
      <!-- Doubled: Take / Drop -->
      <div id="cube-offer" class="board-popup" style="display:none">
        <div id="cube-offer-msg"></div>
        <div class="btn-row">
          <button id="btn-take" class="btn-go" title="Take (T)">Take</button>
          <button id="btn-drop" class="secondary" title="Drop">Drop</button>
        </div>
      </div>
      <!-- Turn start: Roll / Double, only when there is a choice (else it rolls itself) -->
      <div id="roll-popup" class="board-popup" style="display:none">
        <button id="pop-roll" title="Roll (Enter)">Roll</button>
        <button id="btn-double" title="Offer a double before rolling (D)">Double</button>
      </div>
      <!-- Win overlay: covers only the board, so the sidebar log stays usable -->
      <div id="win-overlay" style="display:none">
        <div class="card" id="win-card">
          <h2>Game Over</h2>
          <p id="winner-msg"></p>
          <p id="score-msg" class="muted" style="display:none"></p>
          <p id="rematch-msg" style="display:none; text-align:center; color: var(--yellow)"></p>
          <div class="btn-row">
            <button id="btn-analyze" class="secondary">Analyze Game</button>
            <button id="btn-copy-log" class="secondary">Copy Log</button>
            <button id="btn-rematch" class="btn-go" title="Next game in this room (the score carries over)">Rematch</button>
            <button id="btn-play-again" title="Back to the start screen (a different game, players or settings)">Leave</button>
          </div>
          <div id="analysis" style="display:none"></div>
        </div>
      </div>
    </div>
    <div id="analysis-panel" style="display:none">
      <div class="ap-head">
        <h2>Game Analysis</h2>
        <span class="ap-head-btns">
          <button id="btn-ap-copy" class="link-btn" title="Copy the move log (to paste or save)">Copy log</button>
          <button id="btn-close-analysis" class="secondary" title="Back to the game (Esc)">Close</button>
        </span>
      </div>
      <div id="ap-games" class="tabs" style="display:none; flex-wrap: wrap"></div>
      <div id="ap-summary"></div>
      <div id="ap-status" class="ap-status"></div>
      <div id="ap-chart"></div>
      <div class="ap-filters">
        <select id="ap-filter">
          <option value="all">All rolls</option>
          <option value="errors">Errors only</option>
        </select>
        <select id="ap-player"></select>
        <span class="muted">← → to step</span>
      </div>
      <div id="ap-moves"></div>
      <div id="ap-detail"></div>
    </div>
    <div id="sidebar">
      <div id="dice-area">
        <div class="die" id="die-0">–</div>
        <div class="die" id="die-1">–</div>
        <button id="btn-roll" disabled style="display:none">Roll</button>
      </div>
      <div id="cube-area" style="display:none">
        <div id="cube" title="Doubling cube">1</div>
        <span id="cube-owner"></span>
      </div>
      <div id="score-line" style="display:none"></div>
      <div id="commit-area">
        <button id="btn-commit" style="display:none">Commit Turn</button>
        <button id="btn-skip" class="secondary" style="display:none" title="Skip this die (−)">Skip Die (−)</button>
        <button id="btn-undo" class="secondary" style="display:none" title="Undo the last die (U)">Undo (U)</button>
      </div>
      <div id="turn-banner"></div>
      <div id="move-hint" style="display:none"></div>
      <div id="player-list"></div>
      <div id="game-log"></div>
      <div id="settings">
        <label title="After each roll, show how the robot would have played it"><input type="checkbox" id="opt-feedback"> Move feedback</label>
        <label title="Offer a rollout analysis of your moves when the game ends"><input type="checkbox" id="opt-analysis"> Post-game analysis</label>
        <label title="Small numbers on the squares: how far each one is from your home (the move log uses the mover's numbers)"><input type="checkbox" id="opt-numbers"> Numbers on board</label>
        <div class="btn-row small-links">
          <button id="btn-game-profile" class="link-btn" style="display:none">⚙ Profile &amp; settings</button>
          <button id="btn-quit" class="link-btn" title="Leave this game (against people: resign)">Quit</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="screen-gameover" class="screen">
  <div class="card">
    <h2>Game Over</h2>
    <p id="winner-msg-old"></p>
    <button id="btn-play-again-old">Play Again</button>
  </div>
</div>

<!-- ===== JS ===== -->
<script type="module" src="js/main.js"></script>
</body>
</html>
