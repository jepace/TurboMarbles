<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 6 pie slices, one per player color, arranged clockwise -->
  <!-- Each slice spans 60 degrees. Center at 16,16, radius 14. -->
  <!-- Slice angles: 0=top, going clockwise. Using path arc. -->
  <!-- Yellow: -90 to -30 (top to upper-right) -->
  <path d="M16,16 L16,2 A14,14 0 0,1 28.12,9 Z" fill="#f5d000"/>
  <!-- Orange: -30 to 30 -->
  <path d="M16,16 L28.12,9 A14,14 0 0,1 28.12,23 Z" fill="#ff7800"/>
  <!-- Pink: 30 to 90 -->
  <path d="M16,16 L28.12,23 A14,14 0 0,1 16,30 Z" fill="#e8208c"/>
  <!-- White: 90 to 150 -->
  <path d="M16,16 L16,30 A14,14 0 0,1 3.88,23 Z" fill="#c8c8c8"/>
  <!-- Green: 150 to 210 -->
  <path d="M16,16 L3.88,23 A14,14 0 0,1 3.88,9 Z" fill="#44bb44"/>
  <!-- Blue: 210 to 270 -->
  <path d="M16,16 L3.88,9 A14,14 0 0,1 16,2 Z" fill="#2288f0"/>
  <!-- Center hub -->
  <circle cx="16" cy="16" r="5" fill="#1a1a2e"/>
  <circle cx="16" cy="16" r="3" fill="#ffffff" opacity="0.15"/>
</svg>
